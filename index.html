<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <!-- 
d-flex
flex-row, flex-column, flex-row-reverse, flex-column-reverse
justify-content-start,justify-content-center,justify-content-end, justify-content-between,justify-content-around

flex-wrap

-->
  <body>
    <div
      class="d-flex justify-content-around align-items-center border p-2"
      style="height: 200px"
    >
      <div class="p-3 bg-primary text-white">Item 1</div>
      <div class="p-3 bg-success text-white">Item 2</div>
    </div>
    <hr />
    <div class="d-flex align-items-center border" style="height: 200px">
      <div class="bg-primary text-white p-3">Centered vertically</div>
    </div>
    <hr />
    <div class="d-flex flex-wrap">
      <div class="p-3 bg-primary m-2">1</div>
      <div class="p-3 bg-success m-2">2</div>
      <div class="p-3 bg-danger m-2">3</div>
      <div class="p-3 bg-warning m-2">4</div>
    </div>
    <hr />
    <div class="d-flex justify-content-center flex-wrap border" style="height: 200px">
      <div class="align-self-start bg-primary p-3">Top</div>
      <div class="align-self-center bg-success p-3">Center</div>
      <div class="align-self-end bg-danger p-3">Bottom</div>
    </div>
    <hr />
    <div
      class="d-flex justify-content-between align-items-center p-3 bg-dark text-white"
    >
      <div>Logo</div>
      <div>Menu</div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
